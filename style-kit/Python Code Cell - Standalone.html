  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  /* warm tan — borders              */\n\n    /* ---- Semantic tokens (use these in product code) ----\n       Original astro-theme-cactus names preserved as the public API. */\n    --color-global-bg:   var(--parchment);             /* page background      */\n    --color-global-text: var(--umber);                 /* body text            */\n    --color-link:        var(--terracotta);            /* hyperlinks           */\n    --color-accent:      var(--terracotta);            /* CTAs, active states  */\n    --color-accent-2:    var(--umber);                 /* headings, strong     */\n    --color-quote:       var(--ochre);                 /* blockquotes, marks   */\n    --color-supporting:  var(--sage);                  /* secondary icons/tags */\n    --color-border:      var(--tan);                   /* hairlines, dividers  */\n    --color-card-bg:     rgba(237, 228, 211, 0.85);    /* translucent linen    */\n    --color-shadow:      rgba(61, 43, 31, 0.12);       /* umber-tinted shadow  */\n\n    /* ---- Status hues (shared across themes) ---- */\n    --color-success: #10b981;\n    --color-info:    #3b82f6;\n    --color-warning: #f59e0b;\n    --color-danger:  #ef4444;\n    --color-muted:   #6b7280;\n\n    /* ---- Data visualization (charts/figures) ----\n       Beige field + green/red/grey signal, tuned warm to sit\n       inside the Earthy Academic palette rather than default\n       web-primary red/green. */\n    --chart-bg:        var(--parchment);              /* beige figure background   */\n    --chart-bg-panel:  var(--linen);                  /* card/panel behind a chart */\n    --chart-grid:      var(--tan);                     /* gridlines, axes           */\n    --chart-positive:  #3F7A52;                        /* forest green — increase   */\n    --chart-positive-fill: rgba(63, 122, 82, 0.16);    /* area fill / bg chip       */\n    --chart-negative:  #A63B2E;                        /* brick red — decrease      */\n    --chart-negative-fill: rgba(166, 59, 46, 0.16);\n    --chart-neutral:   #8C8175;                        /* warm grey — no change     */\n    --chart-neutral-fill: rgba(140, 129, 117, 0.16);\n    --chart-label:     var(--umber);                   /* axis labels / numbers     */\n}\n\n/* Dark theme — warm dark-brown evening variant */\n[data-theme=\"dark\"] {\n    --color-global-bg:   #1E1510;                    /* deep umber          */\n    --color-global-text: #EDE4D3;                    /* linen               */\n    --color-link:        var(--terracotta-bright);   /* bright terracotta   */\n    --color-accent:      var(--terracotta-bright);   /* bright terracotta   */\n    --color-accent-2:    var(--parchment);           /* parchment           */\n    --color-quote:       #DFB040;                    /* bright ochre        */\n    --color-supporting:  #7FA694;                    /* lighter sage        */\n    --color-border:      #3E2A1C;                    /* dark warm border    */\n    --color-card-bg:     rgba(40, 28, 18, 0.85);     /* dark card           */\n    --color-shadow:      rgba(0, 0, 0, 0.4);\n\n    /* Data visualization — dark theme */\n    --chart-bg:        #241A12;                      /* deep umber field    */\n    --chart-bg-panel:  #2E2216;\n    --chart-grid:      #4A3626;\n    --chart-positive:  #5FA871;                      /* brighter forest green */\n    --chart-positive-fill: rgba(95, 168, 113, 0.18);\n    --chart-negative:  #D2604C;                      /* brighter brick red  */\n    --chart-negative-fill: rgba(210, 96, 76, 0.18);\n    --chart-neutral:   #A8998A;                      /* light warm grey     */\n    --chart-neutral-fill: rgba(168, 153, 138, 0.18);\n    --chart-label:     var(--parchment);\n}\n<\u002Fstyle>\n  <style>/* ============================================================\n   TYPOGRAPHY — one typeface, monospace, throughout.\n   Everything (headings, body, UI) is JetBrains Mono. The mono\n   grid is the brand's signature: it reads like a well-kept\n   terminal / lab notebook rather than a marketing site.\n   ============================================================ */\n\n:root {\n    /* ---- Families ---- */\n    --font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', 'Courier New', monospace;\n    --font-body: var(--font-mono);    /* body == mono              */\n    --font-display: var(--font-mono); /* headings == mono          */\n\n    /* ---- Weights ---- */\n    --fw-light:    300; /* @kind font */\n    --fw-regular:  400; /* @kind font */\n    --fw-medium:   500; /* @kind font */\n    --fw-semibold: 600; /* @kind font */\n    --fw-bold:     700; /* @kind font */\n\n    /* ---- Type scale (rem; 1rem = 16px) ---- */\n    --text-xs:   0.75rem;   /* 12px — tags, captions, meta     */\n    --text-sm:   0.875rem;  /* 14px — secondary, fine print    */\n    --text-base: 1rem;      /* 16px — body                     */\n    --text-lg:   1.125rem;  /* 18px — lead / card titles       */\n    --text-xl:   1.25rem;   /* 20px — section title (mobile)   */\n    --text-2xl:  1.5rem;    /* 24px — section title (.title)   */\n    --text-3xl:  1.875rem;  /* 30px — h2 prose                 */\n    --text-4xl:  2.25rem;   /* 36px — h1 prose / page hero     */\n\n    /* ---- Line heights ---- */\n    --leading-tight:  1.25;  /* headings           */\n    --leading-snug:   1.4;   /* card titles        */\n    --leading-normal: 1.6;   /* body (brand default) */\n    --leading-relaxed: 1.7;  /* long-form prose    */\n\n    /* ---- Letter spacing ---- */\n    --tracking-tight:  -0.01em;\n    --tracking-normal: 0;\n    --tracking-wide:   0.025em;  /* uppercase tags      */\n    --tracking-wider:  0.06em;   /* section eyebrows    */\n}\n<\u002Fstyle>\n  <style>/* ============================================================\n   SPACING, RADII, SHADOWS, LAYOUT\n   The site is built on a 0.25rem (4px) rhythm with a single\n   narrow reading column. Cards are softly rounded with warm,\n   low-contrast shadows; nothing is sharp or neon.\n   ============================================================ */\n\n:root {\n    /* ---- Spacing scale (0.25rem rhythm) ---- */\n    --space-1:  0.25rem;   /* 4px   */\n    --space-2:  0.5rem;    /* 8px   */\n    --space-3:  0.75rem;   /* 12px  */\n    --space-4:  1rem;      /* 16px  */\n    --space-5:  1.25rem;   /* 20px  */\n    --space-6:  1.5rem;    /* 24px  */\n    --space-8:  2rem;      /* 32px  */\n    --space-12: 3rem;      /* 48px  */\n    --space-16: 4rem;      /* 64px  */\n\n    /* ---- Reading column ---- */\n    --container-max: 57.6rem;   /* @kind other */\n\n    /* ---- Radii ---- */\n    --radius-xs:   2px;     /* inline code            */\n    --radius-sm:   0.25rem; /* tags, small buttons    */\n    --radius-md:   0.375rem;/* buttons, controls      */\n    --radius-lg:   0.5rem;  /* project cards          */\n    --radius-xl:   0.75rem; /* publication/resource cards */\n    --radius-full: 9999px;  /* avatars, dots, pills   */\n\n    /* ---- Shadows (warm, umber-tinted, never harsh) ---- */\n    --shadow-sm:   0 1px 3px 0 var(--color-shadow), 0 1px 2px -1px var(--color-shadow);\n    --shadow-md:   0 4px 12px var(--color-shadow);          /* card hover         */\n    --shadow-lg:   0 8px 25px var(--color-shadow);          /* publication hover  */\n    --shadow-dot:  0 0 0 4px color-mix(in srgb, var(--color-accent) 20%, transparent); /* timeline dot ring */\n\n    /* ---- Borders ---- */\n    --border-hairline: 1px solid var(--color-border);\n    --border-accent:   1px solid var(--color-accent);\n\n    /* ---- Motion ---- */\n    --ease-standard: cubic-bezier(0.4, 0, 0.2, 1); /* @kind other */\n    --ease-out:      cubic-bezier(0.25, 0.46, 0.45, 0.94); /* @kind other */\n    --dur-fast:   0.15s; /* @kind other */\n    --dur-normal: 0.2s; /* @kind other */\n    --dur-slow:   0.3s; /* @kind other */\n\n    /* ---- Backdrop blur (glassy fixed header / cards) ---- */\n    --blur-sm: blur(4px); /* @kind other */\n    --blur-md: blur(8px); /* @kind other */\n    --blur-lg: blur(12px); /* @kind other */\n}\n<\u002Fstyle>\n  <style>/* ============================================================\n   Earthy Academic — global stylesheet entry point.\n   This file is ONLY @import lines. Consumers link this one file\n   and get the full token + font closure.\n   ============================================================ */\n\n/* ============================================================\n   FONTS — webfont declarations\n   The brand uses a single typeface everywhere: JetBrains Mono.\n   It is served from Google Fonts (a real, freely-licensed family),\n   so no local binaries are shipped. If you need offline binaries,\n   self-host the .woff2 files and replace this @import.\n   ============================================================ */\n\n/* cyrillic-ext */\n@font-face {\n  font-family: 'JetBrains Mono';\n  font-style: italic;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"aa1c0967-be33-43b1-87f2-c69cc4c66080\") format('woff2');\n  unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;\n}\n/* cyrillic */\n@font-face {\n  font-family: 'JetBrains Mono';\n  font-style: italic;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"470f2853-acc0-498c-bbe1-a333b8a52913\") format('woff2');\n  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;\n}\n/* greek */\n@font-face {\n  font-family: 'JetBrains Mono';\n  font-style: italic;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"37dafd1c-0b0f-457f-ab97-a204f786b751\") format('woff2');\n  unicode-range: U+0370-0377, U+037A-037F, U+0384-038A, U+038C, U+038E-03A1, U+03A3-03FF;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'JetBrains Mono';\n  font-style: italic;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"ed045b10-cff6-403f-a062-da029828af05\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303 amese */\n@font-face {\n  font-family: 'JetBrains Mono';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"1912fbe0-273c-409a-b255-c856d668ca70\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'JetBrains Mono';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"45098e07-7e95-4c50-aafe-82e3eb2bd552\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'JetBrains Mono';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"d9e0dca3-9851-46e9-b4bb-b04f16ec2408\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n/* ============================================================\n   COLORS — Earthy Academic palette\n   Parchment · Terracotta · Ochre · Sage · Umber\n   Base values + semantic aliases. Light is :root, dark is\n   [data-theme=\"dark\"]. Consumers should set data-theme on <html>.\n   ============================================================ */\n\n:root {\n    /* ---- Base palette (raw brand hues) ---- */\n    --parchment:   #F5F0E8;   /* warm cream page background      */\n    --linen:       #EDE4D3;   /* slightly deeper cream — cards   */\n    --umber:       #3D2B1F;   /* dark warm brown — primary text  */\n    --terracotta:  #B8541C;   /* burnt orange — links, CTAs      */\n    --terracotta-bright: #E07A3A; /* brighter terracotta (dark)  */\n    --ochre:       #C9971A;   /* mustard gold — highlights       */\n    --sage:        #5E7A6A;   /* muted green — tags, supporting  */\n    --tan:         #C8BAA2;   /* warm tan — borders              */\n\n    /* ---- Semantic tokens (use these in product code) ----\n       Original astro-theme-cactus names preserved as the public API. */\n    --color-global-bg:   var(--parchment);             /* page background      */\n    --color-global-text: var(--umber);                 /* body text            */\n    --color-link:        var(--terracotta);            /* hyperlinks           */\n    --color-accent:      var(--terracotta);            /* CTAs, active states  */\n    --color-accent-2:    var(--umber);                 /* headings, strong     */\n    --color-quote:       var(--ochre);                 /* blockquotes, marks   */\n    --color-supporting:  var(--sage);                  /* secondary icons/tags */\n    --color-border:      var(--tan);                   /* hairlines, dividers  */\n    --color-card-bg:     rgba(237, 228, 211, 0.85);    /* translucent linen    */\n    --color-shadow:      rgba(61, 43, 31, 0.12);       /* umber-tinted shadow  */\n\n    /* ---- Status hues (shared across themes) ---- */\n    --color-success: #10b981;\n    --color-info:    #3b82f6;\n    --color-warning: #f59e0b;\n    --color-danger:  #ef4444;\n    --color-muted:   #6b7280;\n\n    /* ---- Data visualization (charts/figures) ----\n       Beige field + green/red/grey signal, tuned warm to sit\n       inside the Earthy Academic palette rather than default\n       web-primary red/green. */\n    --chart-bg:        var(--parchment);              /* beige figure background   */\n    --chart-bg-panel:  var(--linen);                  /* card/panel behind a chart */\n    --chart-grid:      var(--tan);                     /* gridlines, axes           */\n    --chart-positive:  #3F7A52;                        /* forest green — increase   */\n    --chart-positive-fill: rgba(63, 122, 82, 0.16);    /* area fill / bg chip       */\n    --chart-negative:  #A63B2E;                        /* brick red — decrease      */\n    --chart-negative-fill: rgba(166, 59, 46, 0.16);\n    --chart-neutral:   #8C8175;                        /* warm grey — no change     */\n    --chart-neutral-fill: rgba(140, 129, 117, 0.16);\n    --chart-label:     var(--umber);                   /* axis labels / numbers     */\n}\n\n/* Dark theme — warm dark-brown evening variant */\n[data-theme=\"dark\"] {\n    --color-global-bg:   #1E1510;                    /* deep umber          */\n    --color-global-text: #EDE4D3;                    /* linen               */\n    --color-link:        var(--terracotta-bright);   /* bright terracotta   */\n    --color-accent:      var(--terracotta-bright);   /* bright terracotta   */\n    --color-accent-2:    var(--parchment);           /* parchment           */\n    --color-quote:       #DFB040;                    /* bright ochre        */\n    --color-supporting:  #7FA694;                    /* lighter sage        */\n    --color-border:      #3E2A1C;                    /* dark warm border    */\n    --color-card-bg:     rgba(40, 28, 18, 0.85);     /* dark card           */\n    --color-shadow:      rgba(0, 0, 0, 0.4);\n\n    /* Data visualization — dark theme */\n    --chart-bg:        #241A12;                      /* deep umber field    */\n    --chart-bg-panel:  #2E2216;\n    --chart-grid:      #4A3626;\n    --chart-positive:  #5FA871;                      /* brighter forest green */\n    --chart-positive-fill: rgba(95, 168, 113, 0.18);\n    --chart-negative:  #D2604C;                      /* brighter brick red  */\n    --chart-negative-fill: rgba(210, 96, 76, 0.18);\n    --chart-neutral:   #A8998A;                      /* light warm grey     */\n    --chart-neutral-fill: rgba(168, 153, 138, 0.18);\n    --chart-label:     var(--parchment);\n}\n\n/* ============================================================\n   TYPOGRAPHY — one typeface, monospace, throughout.\n   Everything (headings, body, UI) is JetBrains Mono. The mono\n   grid is the brand's signature: it reads like a well-kept\n   terminal / lab notebook rather than a marketing site.\n   ============================================================ */\n\n:root {\n    /* ---- Families ---- */\n    --font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', 'Courier New', monospace;\n    --font-body: var(--font-mono);    /* body == mono              */\n    --font-display: var(--font-mono); /* headings == mono          */\n\n    /* ---- Weights ---- */\n    --fw-light:    300; /* @kind font */\n    --fw-regular:  400; /* @kind font */\n    --fw-medium:   500; /* @kind font */\n    --fw-semibold: 600; /* @kind font */\n    --fw-bold:     700; /* @kind font */\n\n    /* ---- Type scale (rem; 1rem = 16px) ---- */\n    --text-xs:   0.75rem;   /* 12px — tags, captions, meta     */\n    --text-sm:   0.875rem;  /* 14px — secondary, fine print    */\n    --text-base: 1rem;      /* 16px — body                     */\n    --text-lg:   1.125rem;  /* 18px — lead / card titles       */\n    --text-xl:   1.25rem;   /* 20px — section title (mobile)   */\n    --text-2xl:  1.5rem;    /* 24px — section title (.title)   */\n    --text-3xl:  1.875rem;  /* 30px — h2 prose                 */\n    --text-4xl:  2.25rem;   /* 36px — h1 prose / page hero     */\n\n    /* ---- Line heights ---- */\n    --leading-tight:  1.25;  /* headings           */\n    --leading-snug:   1.4;   /* card titles        */\n    --leading-normal: 1.6;   /* body (brand default) */\n    --leading-relaxed: 1.7;  /* long-form prose    */\n\n    /* ---- Letter spacing ---- */\n    --tracking-tight:  -0.01em;\n    --tracking-normal: 0;\n    --tracking-wide:   0.025em;  /* uppercase tags      */\n    --tracking-wider:  0.06em;   /* section eyebrows    */\n}\n\n/* ============================================================\n   SPACING, RADII, SHADOWS, LAYOUT\n   The site is built on a 0.25rem (4px) rhythm with a single\n   narrow reading column. Cards are softly rounded with warm,\n   low-contrast shadows; nothing is sharp or neon.\n   ============================================================ */\n\n:root {\n    /* ---- Spacing scale (0.25rem rhythm) ---- */\n    --space-1:  0.25rem;   /* 4px   */\n    --space-2:  0.5rem;    /* 8px   */\n    --space-3:  0.75rem;   /* 12px  */\n    --space-4:  1rem;      /* 16px  */\n    --space-5:  1.25rem;   /* 20px  */\n    --space-6:  1.5rem;    /* 24px  */\n    --space-8:  2rem;      /* 32px  */\n    --space-12: 3rem;      /* 48px  */\n    --space-16: 4rem;      /* 64px  */\n\n    /* ---- Reading column ---- */\n    --container-max: 57.6rem;   /* @kind other */\n\n    /* ---- Radii ---- */\n    --radius-xs:   2px;     /* inline code            */\n    --radius-sm:   0.25rem; /* tags, small buttons    */\n    --radius-md:   0.375rem;/* buttons, controls      */\n    --radius-lg:   0.5rem;  /* project cards          */\n    --radius-xl:   0.75rem; /* publication/resource cards */\n    --radius-full: 9999px;  /* avatars, dots, pills   */\n\n    /* ---- Shadows (warm, umber-tinted, never harsh) ---- */\n    --shadow-sm:   0 1px 3px 0 var(--color-shadow), 0 1px 2px -1px var(--color-shadow);\n    --shadow-md:   0 4px 12px var(--color-shadow);          /* card hover         */\n    --shadow-lg:   0 8px 25px var(--color-shadow);          /* publication hover  */\n    --shadow-dot:  0 0 0 4px color-mix(in srgb, var(--color-accent) 20%, transparent); /* timeline dot ring */\n\n    /* ---- Borders ---- */\n    --border-hairline: 1px solid var(--color-border);\n    --border-accent:   1px solid var(--color-accent);\n\n    /* ---- Motion ---- */\n    --ease-standard: cubic-bezier(0.4, 0, 0.2, 1); /* @kind other */\n    --ease-out:      cubic-bezier(0.25, 0.46, 0.45, 0.94); /* @kind other */\n    --dur-fast:   0.15s; /* @kind other */\n    --dur-normal: 0.2s; /* @kind other */\n    --dur-slow:   0.3s; /* @kind other */\n\n    /* ---- Backdrop blur (glassy fixed header / cards) ---- */\n    --blur-sm: blur(4px); /* @kind other */\n    --blur-md: blur(8px); /* @kind other */\n    --blur-lg: blur(12px); /* @kind other */\n}\n\n<\u002Fstyle>\n  <script src=\"067789e1-b7de-40c0-978a-935277b9c961\"><\u002Fscript>\n  <style>\n    body { margin: 0; background: var(--parchment); }\n  <\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"width:100%; box-sizing:border-box; background:var(--parchment); padding:var(--space-8); display:flex; flex-direction:column; gap:var(--space-8); font-family:var(--font-mono); color:var(--color-global-text);\">\n\n  <div style=\"display:flex; flex-direction:column; gap:var(--space-2);\">\n    <h1 style=\"margin:0; font-size:var(--text-3xl); font-weight:700; letter-spacing:var(--tracking-tight); color:var(--umber);\">Python Syntax Palette<\u002Fh1>\n    <p style=\"margin:0; font-size:var(--text-sm); color:var(--sage);\">Jupyter-style input/output cell, tuned to the Earthy Academic palette.<\u002Fp>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ showLegend }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"background:var(--linen); border:var(--border-hairline); border-radius:var(--radius-lg); padding:var(--space-5) var(--space-6); box-shadow:var(--shadow-sm);\">\n      <div style=\"display:grid; grid-template-columns:repeat(2, minmax(180px, 1fr)); gap:var(--space-3) var(--space-6);\">\n        <div style=\"display:flex; align-items:baseline; gap:var(--space-2); font-size:var(--text-sm);\">\n          <span style=\"color:var(--terracotta); font-weight:600;\">def<\u002Fspan>\n          <span style=\"color:var(--umber); opacity:0.65;\">Keyword<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex; align-items:baseline; gap:var(--space-2); font-size:var(--text-sm);\">\n          <span style=\"color:var(--umber); font-weight:700;\">magnitude<\u002Fspan>\n          <span style=\"color:var(--umber); opacity:0.65;\">Function name<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex; align-items:baseline; gap:var(--space-2); font-size:var(--text-sm);\">\n          <span style=\"color:var(--terracotta); font-weight:700;\">Vector<\u002Fspan>\n          <span style=\"color:var(--umber); opacity:0.65;\">Class name<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex; align-items:baseline; gap:var(--space-2); font-size:var(--text-sm);\">\n          <span style=\"color:var(--sage);\">print<\u002Fspan>\n          <span style=\"color:var(--umber); opacity:0.65;\">Builtin<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex; align-items:baseline; gap:var(--space-2); font-size:var(--text-sm);\">\n          <span style=\"color:var(--sage); font-style:italic;\">self<\u002Fspan>\n          <span style=\"color:var(--umber); opacity:0.65;\">self / cls<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex; align-items:baseline; gap:var(--space-2); font-size:var(--text-sm);\">\n          <span style=\"color:var(--chart-positive);\">\"text\"<\u002Fspan>\n          <span style=\"color:var(--umber); opacity:0.65;\">String<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex; align-items:baseline; gap:var(--space-2); font-size:var(--text-sm);\">\n          <span style=\"color:var(--ochre);\">3.0<\u002Fspan>\n          <span style=\"color:var(--umber); opacity:0.65;\">Number<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex; align-items:baseline; gap:var(--space-2); font-size:var(--text-sm);\">\n          <span style=\"color:var(--chart-neutral); font-style:italic;\"># comment<\u002Fspan>\n          <span style=\"color:var(--umber); opacity:0.65;\">Comment<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex; align-items:baseline; gap:var(--space-2); font-size:var(--text-sm);\">\n          <span style=\"color:var(--ochre); font-weight:600;\">@dataclass<\u002Fspan>\n          <span style=\"color:var(--umber); opacity:0.65;\">Decorator<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex; align-items:bas
